{% verbatim %}<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribuidora Vetor</title>
<style>
:root{--bg:#EDF0F4;--paper:#fff;--ink:#10242B;--mut:#5B6B73;--line:#D5DBE1;--acc:#2347F5;--ok:#0A7C6C;--bad:#B3261E}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:232px 1fr;min-height:100vh}
h1,h2,.brand{font-family:"Palatino Linotype",Palatino,Georgia,serif;font-weight:700;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
aside{background:var(--ink);color:#E8EEF1;padding:28px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-size:26px;padding:0 10px 22px;display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;background:var(--acc);clip-path:polygon(0 100%,50% 0,100% 100%,50% 70%)}
nav button{all:unset;display:block;width:100%;padding:10px 12px;border-radius:8px;cursor:pointer;color:#B9C7CE}
nav button:hover{background:#1B3640;color:#fff}nav button[aria-current=page]{background:#fff;color:var(--ink);font-weight:600}
.docs{display:grid;gap:2px;margin-top:18px;padding:0 12px}.docs b{font-size:12px;color:#8FA3AC;margin-bottom:4px}
.docs a{color:#B9C7CE;text-decoration:none;padding:5px 0}.docs a:hover{color:#fff;text-decoration:underline}
.who{margin-top:auto;padding:12px;border-radius:10px;background:#1B3640;font-size:13px;color:#B9C7CE}
.who b{display:block;color:#fff;font-size:14px;margin-bottom:8px}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink)}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.d{color:var(--bad)}
.who .btn{width:100%;color:var(--ink)}
main{padding:36px 44px;max-width:1180px;width:100%}
h1{font-size:40px;line-height:1.1;margin-bottom:8px}h1 em{font-style:normal;color:var(--acc)}
h2{font-size:22px;margin:34px 0 12px}.sub{color:var(--mut);max-width:60ch;margin-bottom:26px}
.strip{display:flex;height:84px;gap:3px;border-radius:12px;overflow:hidden}
.seg{all:unset;cursor:pointer;display:flex;align-items:flex-end;padding:10px 12px;color:#fff;font:700 26px Georgia,serif;min-width:44px;transition:flex-grow .3s}
.seg:hover{filter:brightness(1.12)}
.leg{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:14px}
.leg button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center}.leg button:hover{text-decoration:underline}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.bars{display:grid;gap:10px;max-width:640px}
.bar{all:unset;cursor:pointer;display:grid;grid-template-columns:160px 1fr 32px;gap:12px;align-items:center}
.bar span:nth-child(2){height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar span:nth-child(2) i{display:block;height:100%;background:var(--ink)}
.bar:hover span:nth-child(2) i{background:var(--acc)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.tools input,.tools select,dialog input,dialog select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.tools input{flex:1;min-width:220px}
.tbl{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:13px;color:var(--mut);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid #EEF1F4;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:#F6F8FF}tr:last-child td{border:0}
td small{color:var(--mut)}.num{font-variant-numeric:tabular-nums}
.empty{padding:44px;text-align:center;color:var(--mut)}
.vrow{display:flex;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:8px}
.vrow b{flex:1}.vrow .n{font:700 24px Georgia,serif;width:48px;text-align:right}
dialog{border:0;border-radius:16px;padding:26px;width:min(560px,94vw);box-shadow:0 24px 60px #10242B55}
dialog::backdrop{background:#10242B88}
dialog h2{margin:0 0 16px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{display:grid;gap:4px;font-size:13px;color:var(--mut)}.f .w{grid-column:1/-1}
.f input,.f select{width:100%;color:var(--ink);font-size:15px}input:disabled,select:disabled{background:#F3F5F7;color:var(--ink)}
.act{display:flex;gap:10px;margin-top:20px}.act .sp{flex:1}
.aviso{background:#FFF6D6;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
#toast{position:fixed;right:22px;bottom:22px;display:grid;gap:8px;z-index:9}
#toast div{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;max-width:380px;box-shadow:0 8px 24px #0004}
#toast .e{background:var(--bad)}
@media(max-width:820px){.docs{display:none}body{display:block}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:14px;align-items:center}.brand{padding:0 8px 0 0}.who{margin:0 0 0 auto;padding:6px 10px}.who b{display:none}main{padding:22px 16px}h1{font-size:30px}.f{grid-template-columns:1fr}.bar{grid-template-columns:110px 1fr 28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Brasília ao entardecer ===== */
body{display:block;background:#F4F6FA}
.sky{background:linear-gradient(180deg,#0A1A40 0%,#1B3A9C 55%,#F29B54 100%)}.sky.mini{background:#0A1A40}
header{display:flex;align-items:center;gap:28px;padding:18px 48px}
.brand{color:#fff;padding:0}.brand i{background:#FFD08A}
nav{display:flex;gap:6px;margin-right:auto}
nav button{all:unset;padding:8px 18px;border-radius:999px;color:#C9D6F5;cursor:pointer;font-weight:600}
nav button:hover{background:#ffffff26;color:#fff}nav button[aria-current=page]{background:#fff;color:#0A1A40}
.who{display:flex;align-items:center;gap:12px;margin:0;padding:0;background:none}.who b{display:inline;margin:0;color:#C9D6F5;font-weight:500}
.who .btn{width:auto;background:#fff;border-color:#fff}
.hero{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:44px;align-items:end;padding:26px 48px 0;position:relative;border-bottom:7px solid #08142F}
.hero::before{content:"";position:absolute;right:11%;top:22px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,#FFE7B8 0,#FFD08A 55%,#FFD08A00 72%)}
.hero .txt{align-self:center;padding-bottom:34px;position:relative}
.hero h1{color:#fff;font-size:42px;line-height:1.08}.hero h1 .n{display:block;font-size:104px;line-height:.92;color:#FFD08A}
.hero p{color:#C9D6F5;margin-top:14px;max-width:34ch}
.city{display:flex;align-items:flex-end;gap:6px;height:270px;position:relative}
.tower{all:unset;box-sizing:border-box;cursor:pointer;height:var(--h);min-height:104px;min-width:112px;overflow:hidden;background-color:var(--c);
 background-image:repeating-linear-gradient(0deg,transparent 0 11px,#0A1A4059 11px 14px),repeating-linear-gradient(90deg,transparent 0 13px,#0A1A4059 13px 16px);
 border-radius:7px 7px 0 0;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;transition:transform .25s,filter .25s;box-shadow:inset 0 3px 0 #ffffff40}
.tower:hover{transform:translateY(-8px);filter:brightness(1.12)}
.tower b,.tower span{white-space:nowrap;background:#0A1A40D9;color:#fff;border-radius:6px;padding:2px 9px}
.tower b{font:700 28px Georgia,serif}.tower span{font-size:13px;font-weight:600}
.tower.sem{background-color:#7E8FA6;cursor:default}.tower.sem:hover{transform:none;filter:none}
main{max-width:1180px;margin:0 auto;padding:40px 48px 18px}
main h1{font-size:38px}main h2{font-size:24px;margin:6px 0 14px}
.bars{max-width:none;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px 40px}
.bar{padding:12px 16px;background:#fff;border-radius:12px;border:1px solid var(--line);grid-template-columns:130px 1fr 30px}
.bar:hover{border-color:var(--acc);box-shadow:0 6px 20px #2347F522}.bar span:nth-child(2) i{background:linear-gradient(90deg,#1B3A9C,#2347F5)}
.tbl{box-shadow:0 10px 30px #10242B14;border:0}th{background:#F4F6FA}
tbody tr:hover{background:#EEF2FF}
.vrow{border:0;box-shadow:0 6px 18px #10242B12}
footer{max-width:1180px;margin:0 auto;padding:10px 48px 44px;display:flex;flex-wrap:wrap;gap:8px 24px;color:var(--mut);font-size:14px}
footer a{color:var(--acc);font-weight:600;text-decoration:none}footer a:hover{text-decoration:underline}
@media(max-width:820px){header{flex-wrap:wrap;gap:12px;padding:14px 16px}nav{order:3;width:100%}.hero{grid-template-columns:minmax(0,1fr);padding:12px 16px 0;gap:6px}.hero::before{right:6%;top:10px;width:64px;height:64px}
 .hero h1{font-size:30px}.hero h1 .n{font-size:68px}.hero .txt{padding-bottom:12px}.city{height:210px}.tower{min-width:48px;padding:6px 3px;gap:4px}.tower span{white-space:normal;font-size:9px;padding:1px 3px;letter-spacing:-.2px}.tower b{font-size:20px;padding:0 6px}main,footer{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div id="sky" class="sky">
  <header>
    <div class="brand"><i></i>Vetor</div>
    <nav aria-label="Principal">
      <button data-tab="painel">Painel</button>
      <button data-tab="clientes">Clientes</button>
      <button data-tab="vendedores">Vendedores</button>
    </nav>
    <div class="who" id="who"></div>
  </header>
  <div id="hero"></div>
</div>
<main id="view" aria-live="polite"></main>
<footer><span>Documentação:</span><a href="/api/docs/" target="_blank" rel="noopener">API (Redoc)</a><a href="/api/swagger/" target="_blank" rel="noopener">API (Swagger)</a><a href="/api/schema/" target="_blank" rel="noopener">Schema OpenAPI</a><a href="/admin/" target="_blank" rel="noopener">Admin</a></footer>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COR={'Águas Claras':'#2347F5','Taguatinga':'#0FA38F','Vicente Pires':'#E5A800','Guará':'#8B5CF6'},cor=b=>COR[b]||'#9AA7B0',tx=b=>(b=='Vicente Pires'||!COR[b])?'#10242B':'#fff';
let T=localStorage.getItem('vt'),S={tab:'painel',all:[],cl:[],vd:[],bb:[],q:'',b:'',v:''};
const msg=(d,s)=>d?(d.detail||Object.entries(d).map(([k,v])=>k+': '+[].concat(v).join(' ')).join(' · ')):'Erro '+s;
async function api(p,o={}){const h={'Content-Type':'application/json'};if(T)h.Authorization='Token '+T;
 const r=await fetch(p,{...o,headers:h});if(r.status==204)return null;let d=null;try{d=await r.json()}catch{}
 if(!r.ok){if(r.status==401&&T){T=null;localStorage.removeItem('vt');quem();aviso('Sessão expirada. Entre novamente.',1)}throw new Error(msg(d,r.status))}return d}
async function todos(u){let a=[];while(u){const d=await api(u);a=a.concat(d.results);u=d.next}return a}
function aviso(t,e){const d=document.createElement('div');d.textContent=t;if(e)d.className='e';$('#toast').append(d);setTimeout(()=>d.remove(),5000)}
const vnome=id=>(S.vd.find(v=>v.id_vendedor==id)||{}).nome_vendedor||'-';
async function carregar(){
 S.all=await todos('/api/clientes/');S.vd=await todos('/api/vendedores/');S.bb=await api('/api/clientes/bairros/');
 await filtrar();}
async function filtrar(){
 S.cl=S.b?await todos(`/api/clientes/bairro/${encodeURIComponent(S.b)}/`):S.v?await todos(`/api/clientes/vendedor/${S.v}/`):S.all;
 if(S.b&&S.v)S.cl=S.cl.filter(c=>c.vendedor_id==S.v);render()}
function quem(){$('#who').innerHTML=T?`<b>Edição liberada</b><button class="btn" data-act="sair">Sair</button>`:`<b>Somente leitura</b><button class="btn" data-act="entrar">Entrar para editar</button>`}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.dataset.tab==S.tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
 $('#sky').classList.toggle('mini',S.tab!='painel');$('#hero').innerHTML=S.tab=='painel'?hero():'';
 $('#view').innerHTML=({painel,clientes,vendedores})[S.tab]()}
function hero(){
 const n=S.all.length,com=S.bb.reduce((a,x)=>a+x.total,0),sem=n-com,mx=Math.max(1,...S.bb.map(x=>x.total));
 const torres=S.bb.map(x=>`<button class="tower" data-act="bairro" data-v="${E(x.bairro_normalizado)}" style="--h:${30+70*x.total/mx}%;--c:${cor(x.bairro_normalizado)};flex:${x.total}" aria-label="${E(x.bairro_normalizado)}: ${x.total} clientes"><b>${x.total}</b><span>${E(x.bairro_normalizado)}</span></button>`).join('')+(sem?`<span class="tower sem" style="--h:30%;flex:${sem}" title="Sem bairro"><b>${sem}</b><span>sem bairro</span></span>`:'');
 return `<div class="hero"><div class="txt"><h1><span class="n">${n}</span>clientes em ${S.bb.length} bairros</h1><p>Cada prédio é um bairro já normalizado: quanto mais clientes, mais alto. Toque num deles para ver a lista.</p></div><div class="city">${torres}</div></div>`}
function painel(){
 const mx=Math.max(1,...S.vd.map(v=>S.all.filter(c=>c.vendedor_id==v.id_vendedor).length));
 const bars=S.vd.map(v=>{const c=S.all.filter(x=>x.vendedor_id==v.id_vendedor).length;return `<button class="bar" data-act="vend" data-v="${v.id_vendedor}"><span>${E(v.nome_vendedor)}</span><span><i style="width:${c/mx*100}%"></i></span><b class="num">${c}</b></button>`}).join('');
 return `<h2>Clientes por vendedor</h2><div class="bars">${bars}</div>`}
function clientes(){
 const q=S.q.toLowerCase(),L=S.cl.filter(c=>!q||[c.id_cliente,c.razao_social,c.cnpj_normalizado,c.email].join(' ').toLowerCase().includes(q));
 const rows=L.map(c=>`<tr data-act="ver" data-v="${E(c.id_cliente)}"><td class="num"><small>${E(c.id_cliente)}</small></td><td><b>${E(c.razao_social)}</b></td><td>${c.bairro_normalizado?`<span class="dot" style="background:${cor(c.bairro_normalizado)}"></span> ${E(c.bairro_normalizado)}`:'<small>sem bairro</small>'}</td><td>${E(vnome(c.vendedor_id))}</td><td class="num">${E(c.cnpj_normalizado||'-')}</td><td class="num">${E(c.telefone_normalizado||'-')}</td></tr>`).join('');
 const opB=['<option value="">Todos os bairros</option>'].concat(S.bb.map(x=>`<option ${S.b==x.bairro_normalizado?'selected':''}>${E(x.bairro_normalizado)}</option>`)).join('');
 const opV=['<option value="">Todos os vendedores</option>'].concat(S.vd.map(v=>`<option value="${v.id_vendedor}" ${S.v==v.id_vendedor?'selected':''}>${E(v.nome_vendedor)}</option>`)).join('');
 return `<h1>Clientes</h1><p class="sub">${L.length} de ${S.all.length} clientes. Clique numa linha para ver os detalhes.</p>
 <div class="tools"><input id="q" type="search" placeholder="Buscar por nome, CNPJ, e-mail ou código" value="${E(S.q)}" aria-label="Buscar"><select id="fb" aria-label="Bairro">${opB}</select><select id="fv" aria-label="Vendedor">${opV}</select>${T?'<button class="btn p" data-act="novo">Novo cliente</button>':''}</div>
 <div class="tbl">${L.length?`<table><thead><tr><th>Código</th><th>Razão social</th><th>Bairro</th><th>Vendedor</th><th>CNPJ</th><th>Telefone</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">Nenhum cliente encontrado. Limpe a busca ou troque o filtro.</div>'}</div>`}
function vendedores(){
 const rows=S.vd.map(v=>{const c=S.all.filter(x=>x.vendedor_id==v.id_vendedor).length;return `<div class="vrow"><b>${E(v.nome_vendedor)}</b><span class="n num">${c}</span><button class="btn" data-act="vend" data-v="${v.id_vendedor}">Ver clientes</button>${T?`<button class="btn" data-act="edv" data-v="${v.id_vendedor}">Editar</button>`:''}</div>`}).join('');
 return `<h1>Vendedores</h1><p class="sub">Quem atende cada cliente.</p>${T?'<div class="tools"><button class="btn p" data-act="nv">Novo vendedor</button></div>':''}${rows}`}
const FC=[['razao_social','Razão social','w'],['cnpj_normalizado','CNPJ'],['telefone_normalizado','Telefone'],['email','E-mail','w'],['bairro_normalizado','Bairro'],['cep_normalizado','CEP'],['data_cadastro_normalizado','Data de cadastro'],['vendedor_id','Vendedor']];
function formCliente(id){
 const c=id?S.all.find(x=>x.id_cliente==id):{},d=!T?'disabled':'';
 const campo=([k,l,w])=>k=='vendedor_id'?`<label>${l}<select name="${k}" ${d}>${S.vd.map(v=>`<option value="${v.id_vendedor}" ${c.vendedor_id==v.id_vendedor?'selected':''}>${E(v.nome_vendedor)}</option>`).join('')}</select></label>`:`<label class="${w||''}">${l}<input name="${k}" ${k=='data_cadastro_normalizado'?'type="date"':''} value="${E(c[k]||'')}" ${d}></label>`;
 $('#dlg').innerHTML=`<form method="dialog" id="fc" data-id="${E(id||'')}"><h2>${id?E(c.razao_social):'Novo cliente'}</h2>${T?'':'<div class="aviso">Você está no modo somente leitura. Entre para editar.</div>'}<div class="f">${FC.map(campo).join('')}</div>
 <div class="act">${T&&id?'<button type="button" class="btn d" data-act="del">Excluir</button>':''}<span class="sp"></span><button type="button" class="btn" data-act="fechar">Fechar</button>${T?'<button class="btn p" type="submit">Salvar</button>':''}</div></form>`;$('#dlg').showModal()}
function formV(id){const v=S.vd.find(x=>x.id_vendedor==id)||{};
 $('#dlg').innerHTML=`<form method="dialog" id="fv2" data-id="${id||''}"><h2>${id?'Editar vendedor':'Novo vendedor'}</h2><div class="f"><label class="w">Nome<input name="nome_vendedor" value="${E(v.nome_vendedor||'')}" required></label></div><div class="act">${id?'<button type="button" class="btn d" data-act="delv">Excluir</button>':''}<span class="sp"></span><button type="button" class="btn" data-act="fechar">Fechar</button><button class="btn p" type="submit">Salvar</button></div></form>`;$('#dlg').showModal()}
function formLogin(){$('#dlg').innerHTML=`<form method="dialog" id="fl"><h2>Entrar para editar</h2><div class="f"><label class="w">Usuário<input name="username" autocomplete="username" required></label><label class="w">Senha<input name="password" type="password" autocomplete="current-password" required></label></div><div class="act"><span class="sp"></span><button type="button" class="btn" data-act="fechar">Cancelar</button><button class="btn p" type="submit">Entrar</button></div></form>`;$('#dlg').showModal()}
const dados=f=>Object.fromEntries([...new FormData(f)].map(([k,v])=>[k,v===''?null:v]));
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,m=f.dataset.id,x=dados(f);
 try{
  if(f.id=='fl'){const r=await api('/api/auth/token/',{method:'POST',body:JSON.stringify({username:x.username,password:x.password})});T=r.token;localStorage.setItem('vt',T);quem();$('#dlg').close();aviso('Login feito. Edição liberada.');render();return}
  if(f.id=='fc'){x.vendedor_id=+x.vendedor_id;if(!m)delete x.id_cliente;await api(m?`/api/clientes/${m}/`:'/api/clientes/',{method:m?'PATCH':'POST',body:JSON.stringify(x)});aviso(m?'Cliente salvo.':'Cliente criado.');if(!m){S.b=S.v=S.q='';S.cl=null}}
  if(f.id=='fv2'){await api(m?`/api/vendedores/${m}/`:'/api/vendedores/',{method:m?'PATCH':'POST',body:JSON.stringify(x)});aviso('Vendedor salvo.')}
  $('#dlg').close();await carregar()}catch(er){aviso(er.message,1)}});
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;return render()}
 const a=t.dataset.act,v=t.dataset.v;
 try{
  if(a=='bairro'){S.tab='clientes';S.b=v;S.v='';S.q='';await filtrar()}
  else if(a=='vend'){S.tab='clientes';S.v=v;S.b='';S.q='';await filtrar()}
  else if(a=='ver')formCliente(v);else if(a=='novo')formCliente();else if(a=='nv')formV();else if(a=='edv')formV(v);
  else if(a=='entrar')formLogin();else if(a=='fechar')$('#dlg').close();
  else if(a=='sair'){T=null;localStorage.removeItem('vt');quem();aviso('Você saiu.');render()}
  else if(a=='del'){const id=$('#fc').dataset.id;if(confirm('Excluir este cliente?')){await api(`/api/clientes/${id}/`,{method:'DELETE'});$('#dlg').close();aviso('Cliente excluído.');await carregar()}}
